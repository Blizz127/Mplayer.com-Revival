name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: server tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-check CLI and tools
        run: |
          python -m mplayer_server --help >/dev/null
          python ../tools/redirect/generate_hosts.py --file ../tools/redirect/hostnames.txt --ip 127.0.0.1 || true
          python -m py_compile ../tools/redirect/generate_hosts.py ../tools/client_inspect.py
